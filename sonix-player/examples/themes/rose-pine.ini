; Rosé Pine (Main variant) — copy this file to Themes/custom.ini in the ROOT of the SD card.
; Palette source: https://rosepinetheme.com/palette — Reopen Appearance after editing, then select Custom.
; All eight keys are required; no other keys. Roles map as:
;   screen_bg = base, surface = overlay (cards need the stronger step on the V1 panel),
;   surface_pressed = highlight med, panel = cover_bg = the palette's surface (#1f1d2e),
;   text_primary = text, text_secondary = subtle, accent = iris.
[theme]
screen_bg = #191724
surface = #26233a
surface_pressed = #403d52
panel = #1f1d2e
cover_bg = #1f1d2e
text_primary = #e0def4
text_secondary = #908caa
accent = #c4a7e7
