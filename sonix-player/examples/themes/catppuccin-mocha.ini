; Catppuccin Mocha — copy this file to Themes/custom.ini in the ROOT of the SD card.
; Palette source: https://catppuccin.com/palette — Reopen Appearance after editing, then select Custom.
; All eight keys are required; no other keys. Roles map as:
;   screen_bg = base, surface = surface 0, surface_pressed = surface 1,
;   panel = cover_bg = mantle, text_primary = text, text_secondary = subtext 0, accent = blue.
[theme]
screen_bg = #1e1e2e
surface = #313244
surface_pressed = #45475a
panel = #181825
cover_bg = #181825
text_primary = #cdd6f4
text_secondary = #a6adc8
accent = #89b4fa
