; Gruvbox (dark) — copy this file to Themes/custom.ini in the ROOT of the SD card.
; Palette source: https://gruvbox.org/ (classic dark). Reopen Appearance after editing, then select Custom.
; All eight keys are required; no other keys. Roles map as:
;   screen_bg = bg0, surface = bg1, surface_pressed = bg2, panel = cover_bg = bg0_h,
;   text_primary = fg1, text_secondary = fg4, accent = bright orange.
[theme]
screen_bg = #282828
surface = #3c3836
surface_pressed = #504945
panel = #1d2021
cover_bg = #1d2021
text_primary = #ebdbb2
text_secondary = #a89984
accent = #fe8019
