; Dracula (Classic) — copy this file to Themes/custom.ini in the ROOT of the SD card.
; Palette source: https://draculatheme.com/spec (UI colour palette) — Reopen Appearance, then select Custom.
; All eight keys are required; no other keys. Roles map as:
;   screen_bg = background, surface = background light, surface_pressed = background lighter,
;   panel = cover_bg = background dark, text_primary = foreground,
;   text_secondary = comment (Dracula's dim secondary, by design), accent = purple.
[theme]
screen_bg = #282a36
surface = #343746
surface_pressed = #424450
panel = #21222c
cover_bg = #21222c
text_primary = #f8f8f2
text_secondary = #6272a4
accent = #bd93f9
