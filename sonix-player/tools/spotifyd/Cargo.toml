# spotifyd -- the daemon half of Spotify on the TempoTec V1.
#
# Built outside the firmware's Makefile, exactly as librespot itself is: the
# firmware's toolchain is a MIPS cross-compiler with no Rust in it, and the
# daemon does not run on the player. Build this on the computer that will host
# it, then start it. See README.md.
[package]
name = "sonix-spotifyd"
version = "0.1.0"
edition = "2021"
description = "librespot's library and queue over a text socket, with PCM to the player"
license = "MIT"

# The wire format is the library root (src/lib.rs), so `cargo test --lib`
# builds it and nothing else -- no librespot, no ALSA, no OpenSSL. The binary
# imports it as crate::protocol. Two targets out of one source tree, and the
# protocol half is testable on a machine with no audio stack at all.
[lib]
name = "protocol"
path = "src/lib.rs"

[[bin]]
name = "spotifyd"
path = "src/main.rs"

[dependencies]
# 0.6 does not build against a current stable Rust: its build script fails with
# E0277 before a line of this code is compiled. 0.8 renames SpotifyId to
# SpotifyUri throughout the metadata and player APIs, which is a rewrite of the
# glue; 0.7 keeps the SpotifyId-based calls the glue is written against, and is
# edition 2024 on a toolchain that exists today.
librespot = "0.7"
tokio = { version = "1", features = ["full"] }
