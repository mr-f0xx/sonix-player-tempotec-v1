# spotifyd -- the daemon half of Spotify on the TempoTec V1.
#
# Built outside the firmware's Makefile, exactly as librespot itself is: the
# firmware's toolchain is a MIPS cross-compiler with no Rust in it, and the
# daemon does not run on the player. Build this on the computer that will host
# it, then start it. See README.md.
[package]
name = "sonix-spotifyd"
version = "0.1.0"
edition = "2021"
description = "librespot's library and queue over a text socket, with PCM to the player"
license = "MIT"

# The wire format is the library root (src/lib.rs), so `cargo test --lib`
# builds it and nothing else -- no librespot, no ALSA, no OpenSSL. The binary
# imports it as crate::protocol. Two targets out of one source tree, and the
# protocol half is testable on a machine with no audio stack at all.
[lib]
name = "protocol"
path = "src/lib.rs"

[[bin]]
name = "spotifyd"
path = "src/main.rs"

[dependencies]
# librespot-core's build script does `vergen_gitcl::...` and then emits it
# through vergen's Add trait. The resolver picked vergen 9.1.0, which uses
# vergen-lib 9.1.0, while vergen-gitcl 1.0.8 still pulls vergen-lib 0.1.6 --
# two versions of the same crate in one graph, so the trait that ties them
# together resolves to the wrong one and the build script does not compile:
#
#   E0277: the trait bound `vergen::feature::build::Build:
#          vergen_lib::entries::Add` is not satisfied
#
# Naming vergen here, at the same 9.x, makes cargo unify the two: vergen 9.0.6
# depends on vergen-lib 9.0.x exactly as vergen-gitcl 1.0.8 does, and the
# duplicate disappears. This is a build-script dependency of a dependency, so
# the pin is a workaround for librespot, not something this crate uses.
vergen = "=9.0.6"
# 0.6 does not build against a current stable Rust: its build script fails with
# E0277 before a line of this code is compiled. 0.8 renames SpotifyId to
# SpotifyUri throughout the metadata and player APIs, which is a rewrite of the
# glue; 0.7 keeps the SpotifyId-based calls the glue is written against, and is
# edition 2024 on a toolchain that exists today.
librespot = "0.7"
tokio = { version = "1", features = ["full"] }
# These three match the versions librespot 0.7 itself depends on, because the
# types have to be the same types: the rootlist comes back as protobuf bytes
# that only librespot's own protobuf can parse, and the search endpoint is read
# through librespot's http crate. A different major version of any of them is a
# second copy of the type and a "mismatched types" error that looks wrong.
#
#   protobuf 3.7  <Playlist as Metadata>::Message::parse_from_bytes
#   http 1.3      spclient().request_as_json(&Method::GET, ...)
#   serde_json    the search response
protobuf = "3.7"
http = "1.3"
serde_json = "1.0"
