name: TempoTec V1 Web Emulator (WASM & GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Optional branch, tag, or commit to compile into a .sonix-web.zip bundle (empty uses current ref)
        required: false
        type: string
      deploy_pages:
        description: Publish updated emulator + build bundle to GitHub Pages
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/web-emulator-pages.yml
      - sonix-player/**
      - sonix-packer/assets/V1/**
      - tools/v1-emulator/**
      - index.html
      - assets/**
      - coi-serviceworker.js
      - screenshots/ember/**
      - screenshots/tokyonight/**
  push:
    branches:
      - '**'
    tags:
      - '*'

permissions:
  contents: read
  pages: read

# Publishing is main-only, and a release must not be able to skip it.
#
# The github-pages environment only admits the main branch (Settings →
# Environments → github-pages → Deployment branches), so a tag push could never
# publish: 1.7.7's run died with "Tag 1.7.7 is not allowed to deploy to
# github-pages" *after* the release had already been cut, which left the site
# announcing 1.7.6 until somebody pushed to main again. Three consequences:
#
#   1. A tag push no longer deploys. It still builds and uploads its bundle, so
#      the tag gets the artifact; the site comes from main.
#   2. A tag push also *asks for* a main deploy, because a release is exactly
#      the moment the page must not keep pointing at the previous version.
#   3. The refresh step never eats a newer snapshot. A main run that started
#      before the release was published can no longer write the old tag over a
#      newer committed one.
concurrency:
  # Only publications share a deployment queue. A burst of PR/branch builds
  # must not cancel a pending main deployment (or another revision's artifact).
  group: v1-emulator-${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)) && 'pages' || github.run_id }}
  cancel-in-progress: false

jobs:
  build-wasm:
    name: Build WebAssembly firmware bundle (.sonix-web.zip)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
      # A tag push asks for the main deploy that can actually publish (below).
      actions: write

    outputs:
      short_sha: ${{ steps.source.outputs.short_sha }}
      bundle_name: ${{ steps.pack.outputs.bundle_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || github.sha }}

      - name: Record built revision
        id: source
        env:
          BUILD_REF: ${{ inputs.build_ref || github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          ref_label="$BUILD_REF"
          subject="$(git log -1 --format=%s)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "ref_label=$ref_label" >> "$GITHUB_OUTPUT"
          {
            echo "### TempoTec V1 WebAssembly Build"
            echo "- Revision: \`$short_sha\` (\`$ref_label\`)"
            echo "- Commit: $subject"
          } >> "$GITHUB_STEP_SUMMARY"

      # A dispatch can compile an older firmware revision. Package its actual
      # binary/assets, but don't downgrade the site's loader or its boot tests.
      - name: Use this workflow revision's emulator tooling
        if: github.event_name == 'workflow_dispatch' && inputs.build_ref != ''
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --worktree -- tools/v1-emulator index.html assets screenshots/ember screenshots/tokyonight

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle the same-origin WebUSB transport
        run: |
          npm ci --prefix tools/v1-emulator/remote
          npm run build --prefix tools/v1-emulator/remote

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Cache LVGL and FreeType sources
        uses: actions/cache@v4
        with:
          path: |
            sonix-player/lvgl
            sonix-player/freetype-host-src
          key: v1-web-wasm-deps-lvgl96-ft2133-v2

      - name: Compile sonix-player to WebAssembly (Emscripten pthreads)
        run: |
          set -euo pipefail
          emcc --version
          make -C sonix-player -j"$(nproc)" web-wasm
          ls -lh sonix-player/sonix_player_wasm.js sonix-player/sonix_player_wasm.wasm

      # A manual build_ref can predate these screens. Its firmware still runs
      # through the real-bundle Chrome boot test below.
      - name: Check Streaming navigation and browser-only network restrictions
        if: inputs.build_ref == '' || hashFiles('sonix-player/tests/ui/test_streaming_preview.c') != ''
        run: make -C sonix-player/tests -j"$(nproc)" streaming-preview-ui networkmusic-ui

      - name: Pack universal .sonix-web.zip bundle & stage static Pages site
        id: pack
        env:
          BUILD_REF: ${{ steps.source.outputs.ref_label }}
          PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p tools/v1-emulator/dist/pages/builds

          # Carry forward recent previously published builds from live GitHub Pages
          # so the webpage's "Published Sonix Builds" dropdown preserves build history.
          MERGE_ARGS=""
          # The emulator now lives under /emulator/. Fall back to the former
          # root catalog on the first deployment so existing builds survive.
          CATALOG_BASE="$PAGES_BASE_URL/emulator"
          if [ "$PUBLISH" = true ] && { curl --fail --silent --location --max-time 15 \
               "$CATALOG_BASE/builds/manifest.json" -o "$RUNNER_TEMP/prev-manifest.json" || \
             { CATALOG_BASE="$PAGES_BASE_URL"; curl --fail --silent --location --max-time 15 \
               "$CATALOG_BASE/builds/manifest.json" -o "$RUNNER_TEMP/prev-manifest.json"; }; }; then
            echo "Fetched existing catalog from $CATALOG_BASE/builds/manifest.json"
            node -e '
              const fs = require("fs");
              const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              for (const b of (m.builds || []).slice(0, 7)) {
                if (b.url) console.log(b.url);
              }
            ' "$RUNNER_TEMP/prev-manifest.json" | while read -r rel_url; do
              fname="$(basename "$rel_url")"
              if [ -n "$fname" ]; then
                curl --fail --silent --location --max-time 60 \
                  "$CATALOG_BASE/$rel_url" \
                  -o "tools/v1-emulator/dist/pages/builds/$fname" || rm -f "tools/v1-emulator/dist/pages/builds/$fname"
              fi
            done
            MERGE_ARGS="--merge-manifest $RUNNER_TEMP/prev-manifest.json --max-history 8"
          else
            echo "Building without previous Pages history."
          fi

          node tools/v1-emulator/pack-wasm-bundle.mjs \
            --ref "$BUILD_REF" \
            --stage-pages tools/v1-emulator/dist/pages \
            $MERGE_ARGS

          BUNDLE_PATH="$(ls -1 tools/v1-emulator/dist/*.sonix-web.zip | head -n 1)"
          BUNDLE_NAME="$(basename "$BUNDLE_PATH")"
          echo "bundle_path=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"
          echo "bundle_name=$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
          ls -lh tools/v1-emulator/dist/pages tools/v1-emulator/dist/pages/builds

      - name: Boot the compiled firmware and test the build loader in Chrome
        env:
          SONIX_TEST_BUNDLE: ${{ github.workspace }}/${{ steps.pack.outputs.bundle_path }}
        run: |
          npm ci --prefix tools/v1-emulator/tests --ignore-scripts
          npm test --prefix tools/v1-emulator/tests

      # Refresh the same-origin release snapshot used by the landing page.
      # This keeps the release strip working if api.github.com is rate-limited
      # or blocked in a visitor's browser; app.js still tries the live API.
      #
      # Never downgrade: a main run that started before a release was published
      # would otherwise write the older tag over a newer committed snapshot and
      # republish it. Only a strictly newer tag replaces the file, so this step
      # is safe to re-run and safe to race.
      - name: Refresh latest release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag-triggered run fires the instant the tag is pushed, which can
          # be a moment before the release (or its assets) exists. Wait it out.
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            for attempt in $(seq 1 12); do
              published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
                --jq '[.assets[].name] | index("v1.upt") != null' 2>/dev/null || true)"
              if [ "$published" = "true" ]; then
                echo "Release $RELEASE_TAG is published with its v1.upt asset."
                break
              fi
              echo "Waiting for release $RELEASE_TAG and its v1.upt asset (attempt $attempt/12)…"
              sleep 10
            done
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '{tag_name, published_at, html_url, body, assets: [.assets[] | {name, browser_download_url}]}' \
              > "$RUNNER_TEMP/release.json"; then
            newest="$(node -p "require('$RUNNER_TEMP/release.json').tag_name")"
            current="$(node -p "require('./assets/release.json').tag_name")"
            # 1 = newer, 0 = same, -1 = older. Compare numerically so 1.7.10
            # sorts above 1.7.9, which string comparison gets wrong.
            relation="$(node -e '
              const parse = (v) => String(v).replace(/^v/, "").split(".").map((n) => parseInt(n, 10) || 0);
              const a = parse(process.argv[1]);
              const b = parse(process.argv[2]);
              for (let i = 0; i < Math.max(a.length, b.length); i += 1) {
                if ((a[i] || 0) !== (b[i] || 0)) {
                  process.stdout.write((a[i] || 0) > (b[i] || 0) ? "1" : "-1");
                  process.exit(0);
                }
              }
              process.stdout.write("0");
            ' "$newest" "$current")"
            case "$relation" in
              1)
                mv "$RUNNER_TEMP/release.json" assets/release.json
                echo "Release snapshot: $current -> $newest"
                ;;
              0)
                echo "Release snapshot already current at $newest."
                ;;
              *)
                echo "Release snapshot kept at $current: GitHub reported $newest, which is older. Refusing to publish a downgrade."
                ;;
            esac
          else
            echo "Using committed release snapshot ($(node -p "require('./assets/release.json').tag_name"))."
          fi

      # The github-pages environment admits main only, so a tag can build but
      # never publish. Rather than let that run fail at the deploy step and
      # leave the page advertising the previous version (which is what happened
      # to 1.7.7), ask for the deploy that can happen: a main build, which
      # re-reads the release snapshot. The tag still keeps its own artifact.
      - name: Request the main Pages deploy for this release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Tag ${GITHUB_REF_NAME} cannot deploy to the github-pages environment (main only)."
          if gh workflow run web-emulator-pages.yml \
              --ref main \
              -F deploy_pages=true; then
            status="A main deploy was requested to publish release ${GITHUB_REF_NAME}."
          else
            echo "::warning::Could not request the main deploy. Push to main, or run this workflow from main, to publish ${GITHUB_REF_NAME}."
            status="Could not request a main deploy; push to main to publish ${GITHUB_REF_NAME}."
          fi
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo "$status"
            echo ""
            echo "This run's \`.sonix-web.zip\` bundle was still built from \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep the existing emulator tests against the original staged layout,
      # then publish it as a standalone subsite beside the landing page.
      - name: Assemble showcase and emulator Pages site
        run: |
          set -euo pipefail
          mv tools/v1-emulator/dist/pages tools/v1-emulator/dist/emulator-stage
          mkdir -p tools/v1-emulator/dist/pages/screenshots/ember
          mkdir -p tools/v1-emulator/dist/pages/screenshots/tokyonight
          mv tools/v1-emulator/dist/emulator-stage tools/v1-emulator/dist/pages/emulator
          cp index.html coi-serviceworker.js tools/v1-emulator/dist/pages/
          cp -R assets tools/v1-emulator/dist/pages/assets
          cp screenshots/ember/*.png tools/v1-emulator/dist/pages/screenshots/ember/
          cp screenshots/tokyonight/*.png tools/v1-emulator/dist/pages/screenshots/tokyonight/
          touch tools/v1-emulator/dist/pages/.nojekyll

      - name: Upload downloadable .sonix-web.zip artifact
        id: web_artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonix-v1-web-wasm-${{ steps.source.outputs.short_sha }}
          path: tools/v1-emulator/dist/*.sonix-web.zip
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Show how to test this exact revision
        env:
          ARTIFACT_URL: ${{ steps.web_artifact.outputs.artifact-url }}
          REVISION: ${{ steps.source.outputs.short_sha }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/emulator/
        run: |
          echo "[Download the web build for $REVISION]($ARTIFACT_URL), then drop the downloaded ZIP into **Firmware Builds** in the [V1 emulator]($SITE_URL). No extraction or device update needed." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_pages != false)
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_pages != false)
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/v1-emulator/dist/pages

  deploy-pages:
    name: Deploy static V1 emulator to GitHub Pages
    needs: build-wasm
    permissions:
      pages: write
      id-token: write
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages != false)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish live emulator link
        run: |
          {
            echo "### Live TempoTec V1 Browser Emulator"
            echo "Open directly in your browser (zero install): ${{ steps.deployment.outputs.page_url }}emulator/"
            echo ""
            echo "Latest bundle included: \`${{ needs.build-wasm.outputs.bundle_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
