name: TempoTec V1 Web Emulator (WASM & GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Optional branch, tag, or commit to compile into a .sonix-web.zip bundle (empty uses current ref)
        required: false
        type: string
      deploy_pages:
        description: Publish updated emulator + build bundle to GitHub Pages
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/web-emulator-pages.yml
      - sonix-player/**
      - sonix-packer/assets/V1/**
      - tools/v1-emulator/**
  push:
    branches:
      - '**'
    tags:
      - '*'

permissions:
  contents: read
  pages: read

concurrency:
  # Only publications share a deployment queue. A burst of PR/branch builds
  # must not cancel a pending main deployment (or another revision's artifact).
  group: v1-emulator-${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)) && 'pages' || github.run_id }}
  cancel-in-progress: false

jobs:
  build-wasm:
    name: Build WebAssembly firmware bundle (.sonix-web.zip)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    outputs:
      short_sha: ${{ steps.source.outputs.short_sha }}
      bundle_name: ${{ steps.pack.outputs.bundle_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref || github.sha }}

      - name: Record built revision
        id: source
        env:
          BUILD_REF: ${{ inputs.build_ref || github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          ref_label="$BUILD_REF"
          subject="$(git log -1 --format=%s)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "ref_label=$ref_label" >> "$GITHUB_OUTPUT"
          {
            echo "### TempoTec V1 WebAssembly Build"
            echo "- Revision: \`$short_sha\` (\`$ref_label\`)"
            echo "- Commit: $subject"
          } >> "$GITHUB_STEP_SUMMARY"

      # A dispatch can compile an older firmware revision. Package its actual
      # binary/assets, but don't downgrade the site's loader or its boot tests.
      - name: Use this workflow revision's emulator tooling
        if: github.event_name == 'workflow_dispatch' && inputs.build_ref != ''
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --worktree -- tools/v1-emulator

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Cache LVGL and FreeType sources
        uses: actions/cache@v4
        with:
          path: |
            sonix-player/lvgl
            sonix-player/freetype-host-src
          key: v1-web-wasm-deps-lvgl96-ft2133-v2

      - name: Compile sonix-player to WebAssembly (Emscripten pthreads)
        run: |
          set -euo pipefail
          emcc --version
          make -C sonix-player -j"$(nproc)" web-wasm
          ls -lh sonix-player/sonix_player_wasm.js sonix-player/sonix_player_wasm.wasm

      # A manual build_ref can predate these screens. Its firmware still runs
      # through the real-bundle Chrome boot test below.
      - name: Check Streaming navigation and browser-only network restrictions
        if: inputs.build_ref == '' || hashFiles('sonix-player/tests/ui/test_streaming_preview.c') != ''
        run: make -C sonix-player/tests -j"$(nproc)" streaming-preview-ui networkmusic-ui

      - name: Pack universal .sonix-web.zip bundle & stage static Pages site
        id: pack
        env:
          BUILD_REF: ${{ steps.source.outputs.ref_label }}
          PUBLISH: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p tools/v1-emulator/dist/pages/builds

          # Carry forward recent previously published builds from live GitHub Pages
          # so the webpage's "Published Sonix Builds" dropdown preserves build history.
          MERGE_ARGS=""
          if [ "$PUBLISH" = true ] && curl --fail --silent --location --max-time 15 \
               "$PAGES_BASE_URL/builds/manifest.json" \
               -o "$RUNNER_TEMP/prev-manifest.json"; then
            echo "Fetched existing catalog from $PAGES_BASE_URL/builds/manifest.json"
            node -e '
              const fs = require("fs");
              const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              for (const b of (m.builds || []).slice(0, 7)) {
                if (b.url) console.log(b.url);
              }
            ' "$RUNNER_TEMP/prev-manifest.json" | while read -r rel_url; do
              fname="$(basename "$rel_url")"
              if [ -n "$fname" ]; then
                curl --fail --silent --location --max-time 60 \
                  "$PAGES_BASE_URL/$rel_url" \
                  -o "tools/v1-emulator/dist/pages/builds/$fname" || rm -f "tools/v1-emulator/dist/pages/builds/$fname"
              fi
            done
            MERGE_ARGS="--merge-manifest $RUNNER_TEMP/prev-manifest.json --max-history 8"
          else
            echo "Building without previous Pages history."
          fi

          node tools/v1-emulator/pack-wasm-bundle.mjs \
            --ref "$BUILD_REF" \
            --stage-pages tools/v1-emulator/dist/pages \
            $MERGE_ARGS

          BUNDLE_PATH="$(ls -1 tools/v1-emulator/dist/*.sonix-web.zip | head -n 1)"
          BUNDLE_NAME="$(basename "$BUNDLE_PATH")"
          echo "bundle_path=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"
          echo "bundle_name=$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
          ls -lh tools/v1-emulator/dist/pages tools/v1-emulator/dist/pages/builds

      - name: Boot the compiled firmware and test the build loader in Chrome
        env:
          SONIX_TEST_BUNDLE: ${{ github.workspace }}/${{ steps.pack.outputs.bundle_path }}
        run: |
          npm ci --prefix tools/v1-emulator/tests --ignore-scripts
          npm test --prefix tools/v1-emulator/tests

      - name: Upload downloadable .sonix-web.zip artifact
        id: web_artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonix-v1-web-wasm-${{ steps.source.outputs.short_sha }}
          path: tools/v1-emulator/dist/*.sonix-web.zip
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Show how to test this exact revision
        env:
          ARTIFACT_URL: ${{ steps.web_artifact.outputs.artifact-url }}
          REVISION: ${{ steps.source.outputs.short_sha }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          echo "[Download the web build for $REVISION]($ARTIFACT_URL), then drop the downloaded ZIP into **Firmware Builds** in the [V1 emulator]($SITE_URL). No extraction or device update needed." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_pages != false)
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_pages != false)
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/v1-emulator/dist/pages

  # -------------------------------------------------------------------------
  # The Spotify daemon
  #
  # tools/spotifyd is Rust and the firmware toolchain has no Rust, so nothing in
  # this repository ever compiled it: the C client has a test suite and the
  # daemon had a promise. It is built here for two reasons -- to find out
  # whether it compiles at all, and to hand back a binary, because "set up the
  # Spotify daemon" is not a step anybody should have to start with `cargo`.
  #
  # It lives in this workflow rather than one of its own because GitHub only
  # registers a new workflow file once it is on the default branch; this one
  # runs on every branch already.
  # -------------------------------------------------------------------------
  spotifyd:
    name: Build the Spotify daemon
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sonix-player/tools/spotifyd
    steps:
      # Full history and tags, because librespot's build script shells out to
      # git (vergen_gitcl: `git describe`, commit date, sha). A shallow clone
      # is a repository with no tags and no parents, which is the case that
      # build script fails on -- and it fails as a compile error in the build
      # script, E0277, with nothing about git in the message.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sonix-player/tools/spotifyd

      # librespot's native dependencies: a C compiler, pkg-config, ALSA's
      # headers for the default backend, and OpenSSL for the handshake.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libssl-dev

      # The summary is what a person reads on the run's page, and the job log
      # is not always reachable. Errors go there in full, so a failure says
      # what broke without anybody downloading an archive.
      # The protocol is the package's library target but it shares the
      # package's dependency list, so cargo resolves and builds librespot for
      # it too. Compiling it directly with rustc tests the part that has no
      # dependencies at all, and says so in seconds even when librespot is
      # mid-build.
      - name: Protocol tests, rustc only (no librespot, no network)
        run: |
          rustc --edition 2021 --test src/lib.rs -o "$RUNNER_TEMP/protocol-tests" \
            >"$RUNNER_TEMP/rustc.log" 2>&1 || true
          cat "$RUNNER_TEMP/rustc.log"
          if [ ! -x "$RUNNER_TEMP/protocol-tests" ]; then
            echo '::error title=spotifyd protocol does not compile::the wire format needs no dependencies; this is our code, not librespot'
            exit 1
          fi
          "$RUNNER_TEMP/protocol-tests" --test-threads=1 | tee "$RUNNER_TEMP/protocol.log"

      # The protocol itself has already passed above, compiled with rustc and
      # nothing else. This step is about the other half: librespot. It is a
      # dependency of the binary, not of the wire format, so a librespot that
      # will not build is a warning here -- the release build below is where it
      # becomes a failure, and it says why there.
      - name: Does the pinned librespot build?
        continue-on-error: true
        run: |
          cargo build --lib >"$RUNNER_TEMP/librespot.log" 2>&1 || true
          if grep -qE "^error" "$RUNNER_TEMP/librespot.log"; then
            first="$(grep -m1 -E "^error" "$RUNNER_TEMP/librespot.log" || true)"
            echo "::warning title=spotifyd: librespot will not build::${first}"
            echo "LIBRESPOT_BROKEN=1" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          cargo build --release >"$RUNNER_TEMP/build.log" 2>&1 || true
          {
            echo "### Spotify daemon: release build"
            echo '```'
            grep -E "^(error|warning: unused)" -A6 "$RUNNER_TEMP/build.log" | head -n 120 || true
            tail -n 15 "$RUNNER_TEMP/build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/build.log"
          if ! grep -q "Finished" "$RUNNER_TEMP/build.log"; then
            # The whole E0277 block, not just its first line: the trait and the
            # type that failed the bound are on the lines after it, and those
            # are what say whether this is fixable by pinning something.
            # Everything cargo said, stripped of colour, into a file small
            # enough to read in one go -- and the first error line in the
            # annotation, because a message cap can cut the rest.
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/build.log" \
              | grep -vE "^\s*$" | tail -n 60 > "$RUNNER_TEMP/errors.txt"
            first="$(grep -m1 -E "^error(\[[0-9]+\])?:" "$RUNNER_TEMP/errors.txt" || true)"
            echo "::error title=spotifyd does not build::${first}"
            # The detail goes where a 64 KB cap cannot cut it: a step summary
            # renders it on the run page.
            {
              echo "### Why spotifyd did not build"
              echo '```'
              cat "$RUNNER_TEMP/errors.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Stage the binary and its configuration
        run: |
          mkdir -p "$RUNNER_TEMP/spotifyd"
          cp target/release/spotifyd "$RUNNER_TEMP/spotifyd/"
          cp spotifyd.conf.example "$RUNNER_TEMP/spotifyd/"
          cp README.md "$RUNNER_TEMP/spotifyd/"
          cp PROTOCOL.md "$RUNNER_TEMP/spotifyd/"
          file target/release/spotifyd
          ls -la "$RUNNER_TEMP/spotifyd"

      - name: Upload the daemon
        uses: actions/upload-artifact@v4
        with:
          name: spotifyd-linux-x86_64
          path: ${{ runner.temp }}/spotifyd
          if-no-files-found: error

      # Only on failure, but always then: the build log is the only way to read
      # the compiler's own words when the job log endpoint is unreachable.
      - name: Upload the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotifyd-build-log
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/build.log
          if-no-files-found: warn

  deploy-pages:
    name: Deploy static V1 emulator to GitHub Pages
    needs: build-wasm
    permissions:
      pages: write
      id-token: write
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages != false)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish live emulator link
        run: |
          {
            echo "### Live TempoTec V1 Browser Emulator"
            echo "Open directly in your browser (zero install): ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "Latest bundle included: \`${{ needs.build-wasm.outputs.bundle_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
